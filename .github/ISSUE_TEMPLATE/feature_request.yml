name: Feature request
description: Suggest an idea for Kleos.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or the friction, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Kleos help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
