name: Release

# Push a tag like v0.4.0 (or run by hand) to build Kleos.app and attach the DMG to a draft
# release. Builds are ad-hoc signed, not notarized.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build the macOS DMG
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package
        run: pnpm package

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          dmg=$(ls apps/desktop/release/*.dmg)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $dmg --clobber
          else
            gh release create "$tag" $dmg --draft --title "Kleos ${tag#v}" --notes "See CHANGELOG.md."
          fi

      - name: Keep the build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: kleos-dmg
          path: apps/desktop/release/*.dmg
