<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kleos icon, "Sunset" (0.6.1): a sunset sky — night violet, magenta, coral, amber — behind
       the white database mark and its neon cyan line. Render with `node scripts/icon.mjs`. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2d0a5e"/>
      <stop offset="0.42" stop-color="#9d1a9c"/>
      <stop offset="0.72" stop-color="#ff4d78"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1.02" r="0.62">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2d0a5e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px squircle centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <g fill="none" stroke="#fff6fb" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="512" cy="330" rx="210" ry="74"/>
    <path d="M302 330v364c0 41 94 74 210 74s210-33 210-74V330"/>
    <path d="M302 512c0 41 94 74 210 74s210-33 210-74"/>
  </g>
  <g filter="url(#neon)">
    <path d="M248 700 L392 618 L470 662 L594 540 L776 470" fill="none" stroke="#39f3ff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="776" cy="470" r="30" fill="#39f3ff"/>
  </g>
</svg>
