appId: app.kleos.desktop
productName: Kleos
copyright: Copyright © 2026 Arnaud PANAPADEATCHY · MIT License
directories:
  output: release
  buildResources: build
# The main bundle already contains the server, pg, hono and zod; this package's
# `dependencies` (the native modules, ssh2, exceljs) are copied in from node_modules.
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
npmRebuild: true
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: dir
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Ad-hoc signature: enough for Apple Silicon to launch a locally built app.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
dmg:
  title: Kleos
  # The first-open guide (the app is not notarized). Drawn in build/dmg-background.html, rendered
  # to the 1x and @2x PNGs by `node scripts/dmg-background.mjs`; electron-builder pairs them into
  # one Retina TIFF and sizes the window from the 1x image (660 × 440 points).
  background: build/dmg-background.png
  iconSize: 112
  iconTextSize: 12
  # Icon centres, matched to the art: Kleos left, the arrow between, Applications right.
  contents:
    - x: 180
      y: 146
      type: file
    - x: 480
      y: 146
      type: link
      path: /Applications
